<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MoySoporteTec | Soporte Técnico y Tecnología</title>

  <!-- SEO MEJORADO -->
  <meta name="description" content="MoySoporteTec ofrece soporte técnico, reparación de computadoras, redes Wi-Fi, cámaras de seguridad y soluciones TI profesionales.">
  <meta name="keywords" content="soporte técnico, reparación PC, redes, TI, tecnología, MoySoporteTec">
  <meta name="author" content="MoySoporteTec">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
      line-height: 1.6;
      overflow-x: hidden;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background: rgba(7, 26, 43, 0.95);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 45px;
      transition: .3s;
    }

    .logo img:hover {
      transform: scale(1.1);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: 600;
      transition: .3s;
    }

    nav a:hover {
      color: #00aaff;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(135deg, #061522, #0a4b7a);
      color: white;
    }

    .hero h1 {
      font-size: 60px;
      font-weight: 800;
    }

    .hero p {
      font-size: 20px;
      opacity: 0.9;
      margin-top: 10px;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 26px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: .3s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #1ebe5d);
      color: white;
    }

    .btn-email {
      background: white;
      color: #0066aa;
    }

    section {
      padding: 70px 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 36px;
      color: #071a2b;
    }

    /* SERVICIOS */
    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;

      opacity: 0;
      transform: translateY(40px);
      transition: all 0.6s ease;
    }

    .card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      transform: translateY(-12px);
      box-shadow: 0 15px 40px rgba(0,0,0,.15);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    footer {
      background: #04101c;
      color: #aaa;
      text-align: center;
      padding: 25px;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .services {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .navbar {
        flex-direction: column;
      }

      .services {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 35px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="navbar">

    <div class="logo">
      <a href="#inicio">
        <img src="logo.png" alt="Moy SoporteTec Logo">
      </a>
    </div>

    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#servicios">Servicios</a>
      <a href="#contacto">Contacto</a>
    </nav>

  </div>
</header>

<section class="hero" id="inicio">
  <div>
    <h1>MoySoporteTec</h1>
    <p>Soporte técnico y soluciones tecnológicas profesionales</p>

    <div class="buttons">
      <a class="btn btn-whatsapp" href="https://wa.me/525520692796" target="_blank">WhatsApp</a>
      <a class="btn btn-email" href="mailto:moysoportetec@gmail.com">Correo</a>
    </div>
  </div>
</section>

<section id="servicios">
  <div class="container">

    <div class="section-title">
      <h2>Servicios</h2>
    </div>

    <div class="services">

      <div class="card">
        <div class="icon">💻</div>
        <h3>Soporte Técnico</h3>
      </div>

      <div class="card">
        <div class="icon">🔧</div>
        <h3>Reparación de Equipos</h3>
      </div>

      <div class="card">
        <div class="icon">📡</div>
        <h3>Redes y Wi-Fi Empresarial</h3>
      </div>

    </div>

  </div>
</section>

<footer>
  <p>© 2026 MoySoporteTec - Todos los derechos reservados</p>
</footer>

<!-- 🔥 ANIMACIÓN SCROLL -->
<script>
  const cards = document.querySelectorAll('.card');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('show');
      }
    });
  }, { threshold: 0.2 });

  cards.forEach(card => observer.observe(card));
</script>

</body>
</html>
