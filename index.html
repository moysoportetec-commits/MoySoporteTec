<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MoySoporteTec | Soporte Técnico y Tecnología</title>

  <meta name="description" content="MoySoporteTec ofrece soporte técnico, reparación de computadoras, redes Wi-Fi, cámaras de seguridad y venta de tecnología.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: rgba(7, 26, 43, 0.95);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img {
      height: 45px;
      width: auto;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: 600;
      transition: .3s;
    }

    nav a:hover {
      color: #00aaff;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(135deg, #061522, #0a4b7a);
      color: white;
    }

    .hero h1 {
      font-size: 60px;
      font-weight: 800;
    }

    .hero p {
      font-size: 20px;
      opacity: 0.9;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      padding: 14px 26px;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
      transition: .3s;
      display: inline-block;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #1ebe5d);
      color: white;
    }

    .btn-email {
      background: white;
      color: #0066aa;
    }

    /* YOUTUBE BUTTON */
    .btn-youtube {
      background: #ff0000;
      color: white;
    }

    .btn-youtube:hover {
      background: #cc0000;
      transform: translateY(-2px);
    }

    section {
      padding: 70px 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 36px;
      color: #071a2b;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      transition: .3s;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-10px);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    footer {
      background: #04101c;
      color: #aaa;
      text-align: center;
      padding: 25px;
    }

    /* WHATSAPP FLOTANTE */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: #25D366;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 9999;
      transition: .3s;
      animation: pulse 2s infinite;
    }

    .whatsapp-float:hover {
      transform: scale(1.1);
      background: #1ebe5d;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37,211,102,0.5); }
      70% { box-shadow: 0 0 0 15px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }

    @media (max-width: 900px) {
      .services {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .navbar {
        flex-direction: column;
      }

      .services {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 35px;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="navbar">

      <div class="logo">
        <a href="#inicio">
          <img src="logo.png" alt="Moy SoporteTec Logo">
        </a>
      </div>

      <nav>
        <a href="#inicio">Inicio</a>
        <a href="#servicios">Servicios</a>
        <a href="#nosotros">Nosotros</a>
        <a href="#contacto">Contacto</a>
      </nav>

    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="inicio">
    <div>
      <h1>MoySoporteTec</h1>
      <p>Soporte técnico y soluciones tecnológicas para hogares y negocios</p>

      <div class="buttons">
        <a class="btn btn-whatsapp" href="https://wa.me/525520692796" target="_blank">WhatsApp</a>

        <a class="btn btn-email" href="mailto:moysoportetec@gmail.com">Correo</a>

        <a class="btn btn-youtube"
           href="https://www.youtube.com/@moysoportetec"
           target="_blank">
          ▶ YouTube
        </a>
      </div>
    </div>
  </section>

  <!-- SERVICIOS -->
  <section id="servicios">
    <div class="container">

      <div class="section-title">
        <h2>Servicios</h2>
      </div>

      <div class="services">

        <div class="card">
          <div class="icon">💻</div>
          <h3>Soporte Técnico</h3>
        </div>

        <div class="card">
          <div class="icon">🔧</div>
          <h3>Reparación</h3>
        </div>

        <div class="card">
          <div class="icon">📡</div>
          <h3>Redes Wi-Fi</h3>
        </div>

      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 MoySoporteTec - Todos los derechos reservados</p>
  </footer>

  <!-- WHATSAPP FLOTANTE -->
  <a class="whatsapp-float"
     href="https://wa.me/525520692796?text=Hola%20quiero%20información%20de%20MoySoporteTec"
     target="_blank">
    💬
  </a>

</body>
</html>
